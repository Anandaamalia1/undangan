<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Pernikahan - Randy & Intan</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Hubungkan ke file CSS -->
    <link rel="stylesheet" href="opening-style.css">
</head>
<body>

    <div class="opening-cover">
        <!-- Lapisan Hitam Transparan (Opasitas 0.45 agar foto tetap jelas) -->
        <div class="cover-overlay"></div>

        <div class="cover-content">
            <!-- Teks The Wedding Of di paling atas -->
            <span class="cover-subtitle">THE WEDDING OF</span>

            <!-- Grup Tengah (Nama, Tamu, Kutipan, Tombol) -->
            <div class="cover-center-group">
                <!-- Nama Mempelai Dipisah -->
                <div class="cover-names-container">
                    <h1 class="name-groom">Randy</h1>
                    <span class="name-divider">&amp;</span>
                    <h1 class="name-bride">Intan</h1>
                </div>

                <!-- Bagian Tamu -->
                <div class="guest-section">
                    <p class="guest-label">KEPADA YTH. BAPAK/IBU/SAUDARA/I</p>
                    <h3 id="namaTamu">Tamu Undangan Spesial</h3>
                </div>

                <!-- Kutipan / Ayat -->
                <p class="cover-quote">
                    "Dan di antara tanda-tanda kebesaran-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri..."
                </p>

                <!-- Tombol Buka Undangan -->
                <button onclick="bukaUndangan()" class="btn-buka-undangan">
                    BUKA UNDANGAN
                </button>
            </div>

            <div class="cover-bottom-space"></div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- Script untuk mengambil nama tamu dari URL & Mengatur Musik -->
    <script>
        // 1. Ambil nama tamu dari URL (contoh: opening-style.html?to=Budi+Santoso)
        const urlParams = new URLSearchParams(window.location.search);
        const toParam = urlParams.get('to');
        if (toParam) {
            document.getElementById('namaTamu').innerText = decodeURIComponent(toParam.replace(/\+/g, ' '));
        }

        // 2. Fungsi saat tombol BUKA UNDANGAN diklik
        function bukaUndangan() {
            const music = document.getElementById('bgMusic');
            
            // Berikan stempel izin bahwa tamu sudah mengeklik tombol buka undangan
            localStorage.setItem('izinAksesUndangan', 'terbuka');
            localStorage.setItem('playMusic', 'true'); // Untuk menyalakan musik di halaman utama

            // Putar musik lalu masuk ke index.html dengan sedikit jeda agar audio sempat ter-trigger
            music.play().then(() => {
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            }).catch(err => {
                console.log("Audio diblokir browser, tetap masuk ke index:", err);
                window.location.href = 'index.html';
            });
        }
    </script>
</body>
</html>
